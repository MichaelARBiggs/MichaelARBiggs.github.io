<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Publications Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Experimental Publications Feed</h1>
        
        <!-- The visual presentation layout box -->
        <div id="publications-list">Reading database file...</div>
    </main>

    <script>
        // Simple manual parsing function to read BibTeX strings without external frameworks
        function parseBibtex(text) {
            const entries = [];
            // Split individual entry blocks starting with @
            const blocks = text.split(/(?=@\w+\s*\{)/);
            
            blocks.forEach(block => {
                if (!block.trim()) return;
                
                const entry = {};
                // Extract the entry type (e.g., article, inproceedings)
                const typeMatch = block.match(/@(\w+)\s*\{/);
                if (!typeMatch) return;
                entry.type = typeMatch[1].toLowerCase();
                
                // Read standard key value patterns inside the brackets
                const lines = block.split('\n');
                lines.forEach(line => {
                    const cleanLine = line.trim();
                    const match = cleanLine.match(/^(\w+)\s*=\s*[\{\"]?([\s\S]*?)[\}\"]?,?$/);
                    if (match) {
                        const key = match[1].toLowerCase();
                        let value = match[2];
                        // Strip trailing commas or braces
                        value = value.replace(/\}?,?$/, '').trim();
                        entry[key] = value;
                    }
                });
                
                if (entry.title) entries.push(entry);
            });
            return entries;
        }

        // Fetch your Pure repository file directly
        fetch('publications.bib')
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}: File not found`);
                return response.text();
            })
            .then(rawText => {
                const papers = parseBibtex(rawText);
                
                if (papers.length === 0) {
                    document.getElementById('publications-list').innerHTML = "No publications found in the file.";
                    return;
                }
                
                // Build pure clean HTML dynamically
                let html = '<ul style="list-style-type: none; padding: 0;">';
                papers.forEach(paper => {
                    // Clean up author brackets if any exist from the Pure export
                    const cleanAuthors = (paper.author || 'Unknown').replace(/[\{\}]/g, '');
                    const cleanTitle = (paper.title || 'Untitled').replace(/[\{\}]/g, '');
                    
                    html += `
                        <li style="margin-bottom: 24px; line-height: 1.5;">
                            <div style="font-weight: bold; color: #222;">${cleanAuthors}</div>
                            <div style="font-style: italic; color: #444; margin: 4px 0;">"${cleanTitle}"</div>
                            <div style="font-size: 0.9em; color: #666;">
                                ${paper.journal || paper.booktitle || 'Research Output'} 
                                ${paper.year ? `(${paper.year})` : ''}
                            </div>
                            ${paper.doi ? `
                                <div style="margin-top: 6px;">
                                    <a href="https://doi.org{paper.doi}" target="_blank" style="color: #0066cc; font-size: 0.85em; text-decoration: none;">
                                        🔗 View Publisher DOI
                                    </a>
                                </div>
                            ` : ''}
                        </li>
                    `;
                });
                html += '</ul>';
                
                document.getElementById('publications-list').innerHTML = html;
            })
            .catch(error => {
                document.getElementById('publications-list').innerHTML = 
                    `<span style="color: red; font-weight: bold;">Error:</span> ${error.message}`;
            });
    </script>
</body>
</html>
