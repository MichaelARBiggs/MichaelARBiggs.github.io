<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Experimental Publications Feed</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main>

<h1>Experimental Publications Feed</h1>

<!-- Target container for the styled list -->

<div id="publications-list">Reading database file...</div>

</main>

<script>

// 1. Comprehensive dictionary to decode LaTeX symbols and accents into clean Unicode

function decodeLatexAccents(text) {

if (!text) return '';

return text

// Double Quotation Marks
.replace(/``/g, '“')
.replace(/''/g, '”')

// Special punctuation
.replace(/!`/g, '¡')
.replace(/\?`/g, '¿')

// Ordinal indicators
.replace(/\\textordfeminine/g, 'ª')
.replace(/\\textordmasculine/g, 'º')

// German sharp S
.replace(/\{\\SS\}/g, 'ẞ')
.replace(/\\SS\b/g, 'ẞ')
.replace(/\{\\ss\}/g, 'ß')
.replace(/\\ss\b/g, 'ß')


function decodeLatexAccents(text) {

    if (!text) return '';

    let result = text;

    // ------------------------------------------------------------
    // LaTeX accent commands
    //
    // Handles forms such as:
    //   {\'a}  \'a  {\`a}  \`a
    //   {\^a}  \^a  {\"a}  \"a
    //   {\~n}  \~n  {\c c} \c c
    //   {\v s}  \v s
    // ------------------------------------------------------------

    const accentMap = {
        "'": {
            a: 'á', e: 'é', i: 'í', o: 'ó', u: 'ú',
            A: 'Á', E: 'É', I: 'Í', O: 'Ó', U: 'Ú',
            y: 'ý', Y: 'Ý'
        },

        "`": {
            a: 'à', e: 'è', i: 'ì', o: 'ò', u: 'ù',
            A: 'À', E: 'È', I: 'Ì', O: 'Ò', U: 'Ù'
        },

        '"': {
            a: 'ä', e: 'ë', i: 'ï', o: 'ö', u: 'ü',
            A: 'Ä', E: 'Ë', I: 'Ï', O: 'Ö', U: 'Ü',
            y: 'ÿ', Y: 'Ÿ'
        },

        '^': {
            a: 'â', e: 'ê', i: 'î', o: 'ô', u: 'û',
            A: 'Â', E: 'Ê', I: 'Î', O: 'Ô', U: 'Û'
        },

        '~': {
            a: 'ã', e: 'ẽ', i: 'ĩ', o: 'õ', u: 'ũ',
            A: 'Ã', E: 'Ẽ', I: 'Ĩ', O: 'Õ', U: 'Ũ',
            n: 'ñ', N: 'Ñ'
        },

        'v': {
            a: 'ǎ', c: 'č', d: 'ď', e: 'ě',
            l: 'ľ', n: 'ň', o: 'ǒ', r: 'ř',
            s: 'š', t: 'ť', z: 'ž',
            A: 'Ǎ', C: 'Č', D: 'Ď', E: 'Ě',
            L: 'Ľ', N: 'Ň', O: 'Ǒ', R: 'Ř',
            S: 'Š', T: 'Ť', Z: 'Ž'
        },

        '.': {
            z: 'ż', Z: 'Ż'
        },

        'H': {
            o: 'ő', O: 'Ő',
            u: 'ű', U: 'Ű'
        },

        'u': {
            a: 'ă', A: 'Ă',
            g: 'ğ', G: 'Ğ'
        }
    };


    // Apply accent commands with a braced character:
    // {\c c}, {\'a}, {\"o}, {\~n}, etc.

    for (const [command, characters] of Object.entries(accentMap)) {

        for (const [letter, replacement] of Object.entries(characters)) {

            const escapedCommand =
                command.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            const escapedLetter =
                letter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            // {\command letter}
            const braced =
                new RegExp(
                    '\\{\\\\' +
                    escapedCommand +
                    '\\s*' +
                    escapedLetter +
                    '\\}',
                    'g'
                );

            result = result.replace(braced, replacement);

            // \command{letter}
            const commandBracedLetter =
                new RegExp(
                    '\\\\' +
                    escapedCommand +
                    '\\s*\\{' +
                    escapedLetter +
                    '\\}',
                    'g'
                );

            result = result.replace(
                commandBracedLetter,
                replacement
            );

            // \command letter
            const unbraced =
                new RegExp(
                    '\\\\' +
                    escapedCommand +
                    '\\s*' +
                    escapedLetter,
                    'g'
                );

            result = result.replace(unbraced, replacement);
        }
    }


    // ------------------------------------------------------------
    // Special LaTeX characters represented by commands
    // ------------------------------------------------------------

    const specialCharacters = {

        '\\c c': 'ç',
        '\\c C': 'Ç',

        '\\c\\ c': 'ç',
        '\\c\\ C': 'Ç',

        '\\o': 'ø',
        '\\O': 'Ø',

        '\\ae': 'æ',
        '\\AE': 'Æ',

        '\\oe': 'œ',
        '\\OE': 'Œ',

        '\\l': 'ł',
        '\\L': 'Ł',

        '\\ss': 'ß',
        '\\SS': 'ẞ',

        '\\dh': 'ð',
        '\\DH': 'Ð',

        '\\th': 'þ',
        '\\TH': 'Þ',

        '\\aa': 'å',
        '\\AA': 'Å',

        '\\j': 'ȷ'
    };


    // Handle the particularly important cedilla syntax:
    // {\c c} and {\c C}

    result = result
        .replace(/\{\\c\s*c\}/g, 'ç')
        .replace(/\{\\c\s*C\}/g, 'Ç')
        .replace(/\\c\s*c/g, 'ç')
        .replace(/\\c\s*C/g, 'Ç');


    // Other special characters

    for (const [latex, unicode] of Object.entries(specialCharacters)) {

        const escaped =
            latex.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        result = result.replace(
            new RegExp(escaped, 'g'),
            unicode
        );
    }


    // ------------------------------------------------------------
    // LaTeX ligatures and punctuation
    // ------------------------------------------------------------

    result = result
        .replace(/``/g, '“')
        .replace(/''/g, '”')
        .replace(/!`/g, '¡')
        .replace(/\?`/g, '¿')
        .replace(/---/g, '—')
        .replace(/--/g, '–');


    // ------------------------------------------------------------
    // Remove BibTeX grouping braces.
    //
    // At this point braces that were protecting accented characters
    // have already been processed.
    // ------------------------------------------------------------

    result = result.replace(/[{}]/g, '');


    // ------------------------------------------------------------
    // Remove LaTeX commands that may remain around text.
    // ------------------------------------------------------------

    result = result
        .replace(/\\textnormal\s*/g, '')
        .replace(/\\textrm\s*/g, '')
        .replace(/\\textit\s*/g, '')
        .replace(/\\textbf\s*/g, '')
        .replace(/\\emph\s*/g, '')
        .replace(/\\LaTeX\b/g, 'LaTeX')
        .replace(/\\TeX\b/g, 'TeX');


    return result;
}


// 2. Reformat "Firstname Surname" or "Surname, Firstname"
// into Author-Date style ("Surname, F. J.")

function formatAuthorDateStyle(authorString) {

if (!authorString) return 'Unknown Author';

// Clean up basic brackets and escaped characters

let workingString = authorString
.replace(/[\{\}]/g, '')
.replace(/\\\s+/g, ' ')
.replace(/\\\./g, '.')
.replace(/\\/g, '');

// Split multiple authors joined by BibTeX's "and"

const authors = workingString.split(/\s+and\s+/i);

const formattedAuthors = authors.map(author => {

let bits = author.trim();

let surname = '';
let firstname = '';

if (bits.includes(',')) {

const parts = bits.split(',');

surname = parts[0].trim();
firstname = parts.slice(1).join(',').trim();

} else {

const parts = bits.split(/\s+/);

if (parts.length === 1) return bits;

surname = parts.pop();
firstname = parts.join(' ');

}

// Split firstname strings by spaces or hyphens

const nameParts = firstname.split(/[\s\-]+/);

const initials = nameParts

.map(part => {

// Keep Unicode letters, rather than restricting this to A-Z.
// This allows names beginning with characters such as Ø, Ñ, Ł, Š, etc.

const cleanPart = part.replace(
/^[^\p{L}\p{M}]+/u,
'');

if (!cleanPart) return '';

const firstLetter = Array.from(cleanPart)[0];

return firstLetter
? firstLetter.toLocaleUpperCase() + '.'
: '';

})

.filter(initial => initial !== '')

.join(' ');

return initials ? `${surname}, ${initials}` : surname;

});

if (formattedAuthors.length === 1) return formattedAuthors[0];

if (formattedAuthors.length === 2) {
return formattedAuthors.join(' & ');
}

return formattedAuthors.slice(0, -1).join(', ')
+ ' & '
+ formattedAuthors[formattedAuthors.length - 1];

}


// 3. Core BibTeX file reader

function parseBibtex(text) {

const entries = [];

const blocks = text.split(/(?=@\w+\s*\{)/);

blocks.forEach(block => {

if (!block.trim()) return;

const entry = {};

const typeMatch = block.match(/@(\w+)\s*\{/);

if (!typeMatch) return;

entry.type = typeMatch[1].toLowerCase();

const lines = block.split('\n');

lines.forEach(line => {

const cleanLine = line.trim();

const match = cleanLine.match(
/^(\w+)\s*=\s*[\{\"]?([\s\S]*?)[\}\"]?,?$/
);

if (match) {

const key = match[1].toLowerCase();

let value = match[2];

value = value.replace(/\}?,?$/, '').trim();

entry[key] = value;

}

});

if (entry.title) entries.push(entry);

});

return entries;

}


// 4. Fetch loop and page builder

fetch('publications.bib')

.then(response => {

if (!response.ok) {
throw new Error(`HTTP ${response.status}: File not found`);
}

return response.text();

})

.then(rawText => {

const papers = parseBibtex(rawText);

if (papers.length === 0) {

document.getElementById('publications-list').innerHTML =
"No publications found.";

return;

}

let html = '<ul class="pub-list">';

papers.forEach(paper => {

// Apply clean formats and decode international text

const formattedAuthors =
decodeLatexAccents(formatAuthorDateStyle(paper.author));

const cleanTitle =
decodeLatexAccents(paper.title || 'Untitled');

const venue =
decodeLatexAccents(paper.journal || paper.booktitle || '');


// Normalise DOI.
// Accept either:
//   10.1234/example
// or:
//   https://doi.org/10.1234/example

let doiUrl = '';

if (paper.doi) {

let doi = decodeLatexAccents(paper.doi)
.trim();

doi = doi
.replace(/^https?:\/\/doi\.org\//i, '')
.replace(/^doi:\s*/i, '')
.trim();

if (doi) {
doiUrl = `https://doi.org/${doi}`;
}

}


html += `

<li class="pub-item type-${paper.type}">

<span class="pub-author">${formattedAuthors}</span>

${paper.year
? `<span class="pub-year">(${paper.year})</span>`
: ''}

<span class="pub-title">"${cleanTitle}"</span>

${venue
? `<span class="pub-venue">, ${venue}</span>`
: ''}

${paper.volume
? `<span class="pub-volume">, vol. ${paper.volume}</span>`
: ''}

${paper.pages
? `<span class="pub-pages">, pp. ${paper.pages}</span>`
: ''}.

${doiUrl
? `

<div class="pub-doi-container">

<a href="${doiUrl}"
   target="_blank"
   rel="noopener noreferrer"
   class="pub-doi-link">

🔗 View Publisher DOI

</a>

</div>

`
: ''}

</li>

`;

});

html += '</ul>';

document.getElementById('publications-list').innerHTML = html;

})

.catch(error => {

document.getElementById('publications-list').innerHTML =
`<span class="pub-error">Error: ${error.message}</span>`;

});

</script>

</body>

</html>
