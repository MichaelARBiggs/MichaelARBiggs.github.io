<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Publications Page</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load Citation.js via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <main>
        <h1>Experimental Publications Feed</h1>
        <!-- Container where your papers will automatically render -->
        <div id="publications-list">Loading repository data...</div>
    </main>

   <script>
    // 1. Target the exact global variable used by the browser bundle
    const Cite = window.cite;

    // 2. Immediate safety fallback check
    if (!Cite) {
        document.getElementById('publications-list').innerHTML = 
            "<strong>Error:</strong> The Citation.js library failed to load from the CDN link.";
    } else {
        // 3. Fetch the local repository file
        fetch('publications.bib')
            .then(response => {
                // If GitHub returns a 404 or 500, throw a descriptive error instantly
                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status} (${response.statusText})`);
                }
                return response.text();
            })
            .then(bibtexData => {
                // 4. Parse the text data
                const citeInstance = new Cite(bibtexData);

                // 5. Generate standard formatting output
                const formattedHtml = citeInstance.format('bibliography', {
                    format: 'html',
                    template: 'apa',
                    lang: 'en-US'
                });

                // 6. Push to page
                document.getElementById('publications-list').innerHTML = formattedHtml;
            })
            .catch(error => {
                // Instantly output the message so nothing hangs on screen
                document.getElementById('publications-list').innerHTML = 
                    `<strong>Error details:</strong> ${error.message}`;
            });
    }
</script>


</body>
</html>
