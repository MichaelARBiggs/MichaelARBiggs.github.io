<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Publications Page</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load Citation.js via CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <main>
        <h1>Experimental Publications Feed</h1>
        <!-- Container where your papers will automatically render -->
        <div id="publications-list">Loading repository data...</div>
    </main>

   <script>
    // Try both methods of finding the Citation.js library variable
    let Cite;
    try {
        Cite = require('citation-js');
    } catch(e) {
        Cite = window.cite;
    }

    // Safety check if the library itself didn't load from the CDN
    if (!Cite) {
        document.getElementById('publications-list').innerHTML = 
            "<strong>Error:</strong> The Citation.js library failed to load from the CDN.";
    } else {
        // Fetch the file
        fetch('publications.bib')
            .then(response => {
                if (!response.ok) {
                    // This will tell us if it's a 404 Not Found error
                    throw new Error(`Server returned HTTP ${response.status} (${response.statusText})`);
                }
                return response.text();
            })
            .then(bibtexData => {
                const citeInstance = new Cite(bibtexData);
                const formattedHtml = citeInstance.format('bibliography', {
                    format: 'html',
                    template: 'apa',
                    lang: 'en-US'
                });
                document.getElementById('publications-list').innerHTML = formattedHtml;
            })
            .catch(error => {
                console.error('Logged Error:', error);
                // This injects the exact system error onto your screen!
                document.getElementById('publications-list').innerHTML = 
                    `<strong>Error details:</strong> ${error.message}`;
            });
    }
</script>

</body>
</html>
