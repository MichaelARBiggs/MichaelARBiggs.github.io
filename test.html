<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimental Publications Feed</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load bibtex-js via a reliable vanilla-friendly CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <main>
        <h1>Experimental Publications Feed</h1>
        
        <!-- Tell bibtex-js to automatically look for your file -->
        <bibtex src="publications.bib"></bibtex>

        <!-- This div will capture and structure your items automatically -->
        <div id="bibtex_errors"></div>
        <div id="bibtex_display">
            <!-- This template layout dictates how each individual paper card looks -->
            <div class="bibtex_template" style="display: none; margin-bottom: 20px;">
                <div class="if author" style="font-weight: bold;">
                    <span class="author"></span>
                </div>
                <div>
                    <span class="title" style="font-style: italic;"></span> 
                    <span class="if journal">, <span class="journal"></span></span>
                    <span class="if year"> (<span class="year"></span>)</span>.
                </div>
                <div class="if doi" style="margin-top: 4px;">
                    <a class="doi" href="" target="_blank" style="color: #0066cc; font-size: 0.9em;">View DOI Link</a>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
