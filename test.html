<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experimental Publications Feed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
<h1>Experimental Publications Feed</h1>

<!-- Target container for the styled list -->
<div id="publications-list">Reading database file...</div>
</main>

<script>
// 1. Comprehensive dictionary to decode LaTeX symbols and accents into clean Unicode
            // 1. Comprehensive dictionary to decode LaTeX symbols and accents into clean Unicode
function decodeLatexAccents(text) {
if (!text) return '';

return text
// Double Quotation Marks
.replace(/``/g, '“')                    
.replace(/''/g, '”')                    
.replace(/\\"66/g, '“').replace(/\\"99/g, '”') 

// Special Punctuation & Symbols
.replace(/!`|\\textexclamdown/g, '¡')   
.replace(/\?`|\\textquestiondown/g, '¿') 
.replace(/\\textordfeminine/g, 'ª')     
.replace(/\\textordmasculine/g, 'º')    
.replace(/\\SS\b|\{\\SS\}/g, 'ẞ')        
.replace(/\\ss\b|\{\\ss\}/g, 'ß')        

// Vowels with Acutes (í, á, é, ó, ú)
.replace(/\{\\'i\}/g, 'í').replace(/\\\'\{i\}/g, 'í').replace(/\\\'i/g, 'í')
.replace(/\{\\'a\}/g, 'á').replace(/\\\'\{a\}/g, 'á').replace(/\\\'a/g, 'á')
.replace(/\{\\'e\}/g, 'é').replace(/\\\'\{e\}/g, 'é').replace(/\\\'e/g, 'é')
.replace(/\{\\'o\}/g, 'ó').replace(/\\\'\{o\}/g, 'ó').replace(/\\\'o/g, 'ó')
.replace(/\{\\'u\}/g, 'ú').replace(/\\\'\{u\}/g, 'ú').replace(/\\\'u/g, 'ú')

// Vowels with Umlauts / Diaeresis (ï, ä, ë, ö, ü)
.replace(/\{\\"i\}/g, 'ï').replace(/\\\"\{i\}/g, 'ï').replace(/\\\"i/g, 'ï')
.replace(/\{\\"a\}/g, 'ä').replace(/\\\"\{a\}/g, 'ä').replace(/\\\"a/g, 'ä')
.replace(/\{\\"e\}/g, 'ë').replace(/\\\"\{e\}/g, 'ë').replace(/\\\"e/g, 'ë')
.replace(/\{\\"o\}/g, 'ö').replace(/\\\"\{o\}/g, 'ö').replace(/\\\"o/g, 'ö')
.replace(/\{\\"u\}/g, 'ü').replace(/\\\"\{u\}/g, 'ü').replace(/\\\"u/g, 'ü')

// Circumflex (â, ê, ô)
.replace(/\{\\^a\}/g, 'â').replace(/\\\^\{a\}/g, 'â').replace(/\\\^a/g, 'â')
.replace(/\{\\^e\}/g, 'ê').replace(/\\\^\{e\}/g, 'ê').replace(/\\\^e/g, 'ê')
.replace(/\{\\^o\}/g, 'ô').replace(/\\\^\{o\}/g, 'ô').replace(/\\\^o/g, 'ô')

// Tildes (ã, ẽ, õ)
.replace(/\{\\~a\}/g, 'ã').replace(/\\\~\{a\}/g, 'ã').replace(/\\\~a/g, 'ã')
.replace(/\{\\~e\}/g, 'ẽ').replace(/\\\~\{e\}/g, 'ẽ').replace(/\\\~e/g, 'ẽ')
.replace(/\{\\~o\}/g, 'õ').replace(/\\\~\{o\}/g, 'õ').replace(/\\\~o/g, 'õ')

// Ring (å) and Cedilla (ç)
.replace(/\{\\ra\}/g, 'å').replace(/\\r\{a\}/g, 'å').replace(/\\ra/g, 'å')
.replace(/\{\\cc\}/g, 'ç').replace(/\\c\{c\}/g, 'ç').replace(/\\cc/g, 'ç')

// Final structural LaTeX cleanup
.replace(/[\{\}]/g, '');
}

// 2. Reformat "Firstname Surname" or "Surname, Firstname" into Author-Date style ("Surname, F. J.")
function formatAuthorDateStyle(authorString) {
if (!authorString) return 'Unknown Author';

// Clean up basic brackets and any accidental escaped periods or backslashes
let workingString = authorString
.replace(/[\{\}]/g, '')
.replace(/\\\s+/g, ' ')  // Fixes escaped spaces like "\ "
.replace(/\\\./g, '.')   // Fixes escaped periods like "\."
.replace(/\\/g, '');     // Strips out any other stray backslashes

// Split multiple authors joined by academic " and "
const authors = workingString.split(/\s+and\s+/i);

const formattedAuthors = authors.map(author => {
let bits = author.trim();
let surname = '';
let firstname = '';

if (bits.includes(',')) {
const parts = bits.split(',');
surname = parts[0].trim();
firstname = parts[1].trim();
} else {
const parts = bits.split(/\s+/);
if (parts.length === 1) return bits; 
surname = parts.pop(); 
firstname = parts.join(' ');
}

// Split firstname strings by spaces or hyphens to extract all given name parts
const nameParts = firstname.split(/[\s\-]+/);
const initials = nameParts
.map(part => {
// Strip punctuation/noise to look for a real letter
const cleanPart = part.replace(/^[^a-zA-Z0-9]+/, '');
return cleanPart ? cleanPart.charAt(0).toUpperCase() + '.' : '';
})
.filter(initial => initial !== '') // Drop empty parts
.join(' '); // Formats as "F. J."

return initials ? `${surname}, ${initials}` : surname;
});

if (formattedAuthors.length === 1) return formattedAuthors[0];
if (formattedAuthors.length === 2) return formattedAuthors.join(' & ');
return formattedAuthors.slice(0, -1).join(', ') + ' & ' + formattedAuthors[formattedAuthors.length - 1];
}

// 3. Core BibTeX file reader
function parseBibtex(text) {
const entries = [];
const blocks = text.split(/(?=@\w+\s*\{)/);

blocks.forEach(block => {
if (!block.trim()) return;
const entry = {};
const typeMatch = block.match(/@(\w+)\s*\{/);
if (!typeMatch) return;
entry.type = typeMatch[1].toLowerCase();

const lines = block.split('\n');
lines.forEach(line => {
const cleanLine = line.trim();
const match = cleanLine.match(/^(\w+)\s*=\s*[\{\"]?([\s\S]*?)[\}\"]?,?$/);
if (match) {
const key = match[1].toLowerCase();
let value = match[2];
value = value.replace(/\}?,?$/, '').trim();
entry[key] = value;
}
});
if (entry.title) entries.push(entry);
});
return entries;
}

// 4. Fetch loop and page builder
fetch('publications.bib')
.then(response => {
if (!response.ok) throw new Error(`HTTP ${response.status}: File not found`);
return response.text();
})
.then(rawText => {
const papers = parseBibtex(rawText);
if (papers.length === 0) {
document.getElementById('publications-list').innerHTML = "No publications found.";
return;
}

let html = '<ul class="pub-list">';
papers.forEach(paper => {
// Apply clean formats and decode international text
const formattedAuthors = decodeLatexAccents(formatAuthorDateStyle(paper.author));
const cleanTitle = decodeLatexAccents(paper.title || 'Untitled');
const venue = decodeLatexAccents(paper.journal || paper.booktitle || '');

html += `
                       <li class="pub-item type-${paper.type}">
                           <span class="pub-author">${formattedAuthors}</span>
                           ${paper.year ? `<span class="pub-year">(${paper.year})</span>` : ''}
                           <span class="pub-title">"${cleanTitle}"</span>
                           ${venue ? `<span class="pub-venue">, ${venue}</span>` : ''}
                           ${paper.volume ? `<span class="pub-volume">, vol. ${paper.volume}</span>` : ''}
                           ${paper.pages ? `<span class="pub-pages">, pp. ${paper.pages}</span>` : ''},
                           ${paper.publisher ? `<span class="publisher">, pp. ${paper.publisher}</span>` : ''}.
                           ${paper.doi ? `
                               <div class="pub-doi-container">
                                   <a href="https://doi.org/${paper.doi}" target="_blank" class="pub-doi-link">
                                       🔗 View Publisher DOI
                                   </a>
                               </div>
                           ` : ''}
                       </li>
                   `;
});
html += '</ul>';
document.getElementById('publications-list').innerHTML = html;
})
.catch(error => {
document.getElementById('publications-list').innerHTML = `<span class="pub-error">Error: ${error.message}</span>`;
});
</script>
</body>
</html>
