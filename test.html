// 2. Reformat "Firstname Surname" or "Surname, Firstname"
// into Author-Date style ("Surname, F. J.")

function formatAuthorDateStyle(authorString) {

if (!authorString) return 'Unknown Author';

// Clean up basic brackets and escaped characters

let workingString = authorString
.replace(/[\{\}]/g, '')
.replace(/\\\s+/g, ' ')
.replace(/\\\./g, '.')
.replace(/\\/g, '');

// Split multiple authors joined by BibTeX's "and"

const authors = workingString.split(/\s+and\s+/i);

const formattedAuthors = authors.map(author => {

let bits = author.trim();

let surname = '';
let firstname = '';

if (bits.includes(',')) {

const parts = bits.split(',');

surname = parts[0].trim();
firstname = parts.slice(1).join(',').trim();

} else {

const parts = bits.split(/\s+/);

if (parts.length === 1) return bits;

surname = parts.pop();
firstname = parts.join(' ');

}

// Split firstname strings by spaces or hyphens

const nameParts = firstname.split(/[\s\-]+/);

const initials = nameParts

.map(part => {

// Keep Unicode letters, rather than restricting this to A-Z.
// This allows names beginning with characters such as Ø, Ñ, Ł, Š, etc.

const cleanPart = part.replace(
/^[^\p{L}\p{M}]+/u,
'');

if (!cleanPart) return '';

const firstLetter = Array.from(cleanPart)[0];

return firstLetter
? firstLetter.toLocaleUpperCase() + '.'
: '';

})

.filter(initial => initial !== '')

.join(' ');

return initials ? `${surname}, ${initials}` : surname;

});

if (formattedAuthors.length === 1) return formattedAuthors[0];

if (formattedAuthors.length === 2) {
return formattedAuthors.join(' & ');
}

return formattedAuthors.slice(0, -1).join(', ')
+ ' & '
+ formattedAuthors[formattedAuthors.length - 1];

}


// 3. Core BibTeX file reader

function parseBibtex(text) {

const entries = [];

const blocks = text.split(/(?=@\w+\s*\{)/);

blocks.forEach(block => {

if (!block.trim()) return;

const entry = {};

const typeMatch = block.match(/@(\w+)\s*\{/);

if (!typeMatch) return;

entry.type = typeMatch[1].toLowerCase();

const lines = block.split('\n');

lines.forEach(line => {

const cleanLine = line.trim();

const match = cleanLine.match(
/^(\w+)\s*=\s*[\{\"]?([\s\S]*?)[\}\"]?,?$/
);

if (match) {

const key = match[1].toLowerCase();

let value = match[2];

value = value.replace(/\}?,?$/, '').trim();

entry[key] = value;

}

});

if (entry.title) entries.push(entry);

});

return entries;

}


// 4. Fetch loop and page builder

fetch('publications.bib')

.then(response => {

if (!response.ok) {
throw new Error(`HTTP ${response.status}: File not found`);
}

return response.text();

})

const papers = parseBibtex(rawText);

// Apply clean formats and decode international text

const cleanTitle =
decodeLatexAccents(paper.title || 'Untitled');

const venue =
decodeLatexAccents(paper.journal || paper.booktitle || '');


// Normalise DOI.
// Accept either:
//   10.1234/example
// or:
//   https://doi.org/10.1234/example

let doiUrl = '';

if (paper.doi) {

let doi = decodeLatexAccents(paper.doi)
.trim();

doi = doi
.replace(/^https?:\/\/doi\.org\//i, '')
.replace(/^doi:\s*/i, '')
.trim();

if (doi) {
doiUrl = `https://doi.org/${doi}`;
}

}


html += `

<li class="pub-item type-${paper.type}">

<span class="pub-author">${formattedAuthors}</span>

${paper.year
? `<span class="pub-year">(${paper.year})</span>`
: ''}

<span class="pub-title">"${cleanTitle}"</span>

${venue
? `<span class="pub-venue">, ${venue}</span>`
: ''}

${paper.volume
? `<span class="pub-volume">, vol. ${paper.volume}</span>`
: ''}

${paper.pages
? `<span class="pub-pages">, pp. ${paper.pages}</span>`
: ''}.

${doiUrl
? `

<div class="pub-doi-container">

<a href="${doiUrl}"
   target="_blank"
   rel="noopener noreferrer"
   class="pub-doi-link">

🔗 View Publisher DOI

</a>

</div>

`
: ''}

</li>

`;

});

html += '</ul>';

document.getElementById('publications-list').innerHTML = html;

})

.catch(error => {

document.getElementById('publications-list').innerHTML =
`<span class="pub-error">Error: ${error.message}</span>`;

});

</script>
