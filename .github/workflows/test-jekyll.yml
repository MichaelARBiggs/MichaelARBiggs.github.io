name: Test Jekyll Build

on:
  push:
    branches:
      - experiment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll
        run: gem install jekyll

      - name: Build Jekyll
        run: jekyll build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: experimental-site
          path: _site
